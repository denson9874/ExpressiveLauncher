    stabilityConfigurationFiles.addAll(
        layout.projectDirectory.file("compose_compiler_config.conf"),
    )
    reportsDestination = layout.buildDirectory.dir("compose_build_reports")
}

addFrameworkJar('framework-16.jar')

def robolectricConscrypt = configurations.create("robolectricConscrypt") {
    canBeConsumed = false
    canBeResolved = true
}
def unsignedRobolectricConscrypt = tasks.register("unsignedRobolectricCryptoProviders", Jar) {
    archiveFileName = "robolectric-crypto-providers-unsigned.jar"
    destinationDirectory = layout.buildDirectory.dir("robolectric")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ robolectricConscrypt.collect { zipTree(it) } })
    // Android's unit-test bytecode transform rewrites classes. Removing the
    // upstream JAR signature first prevents those legitimate rewrites from
    // being rejected by Java's signed-entry verifier at test startup.
    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
}

dependencies {
    add("robolectricConscrypt", "org.conscrypt:conscrypt-openjdk-uber:2.6.2")
