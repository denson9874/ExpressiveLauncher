name = "expressive-pro-activation"
main = "worker.js"
compatibility_date = "2024-09-01"

# Cloudflare KV namespace for storing activated device and transaction licenses
kv_namespaces = [
  { binding = "EXPRESSIVE_PRO_KV", id = "58380b9ca23940e4a3aa59c928b5eec1", preview_id = "EXPRESSIVE_PRO_LICENSES_PREVIEW_KV_ID" }
]

# Records license moves to new devices one at a time (the move limit must hold under parallel
# requests, which KV can't guarantee). SQLite-backed, so it works on the Workers Free plan.
[[durable_objects.bindings]]
name = "LICENSE_LEDGER"
class_name = "LicenseLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LicenseLedger"]

# Sensitive secrets (Set with `wrangler secret put <NAME>`):
# - PRO_PRIVATE_KEY_PEM: Master ECDSA P-256 private key. The worker holds the only copy: never
#   delete or replace it (`wrangler deploy` keeps it).
# - ADMIN_TOKEN: Long random token for POST /api/admin/issue (scripts/issue_pro_key.py)
# - PAYPAL_WEBHOOK_ID: ID of the webhook in the PayPal dashboard; webhooks are refused without it. It
#   must belong to the same REST app as the credentials below.
# - PAYPAL_CLIENT_ID: PayPal REST API client ID (webhook checks, transaction lookups, and creating and
#   capturing the /api/checkout orders)
# - PAYPAL_CLIENT_SECRET: PayPal REST API client secret
# - PAYPAL_MERCHANT_ID (optional): the seller's PayPal merchant ID; captures paid to anyone else
#   are refused. Not secret, but kept out of this public file.
#
# The webhook (POST /api/paypal-webhook) needs PAYMENT.CAPTURE.COMPLETED, .DENIED, .REFUNDED and
# .REVERSED. Optional overrides, as [vars] or secrets:
# - PRO_PRICE / PRO_CURRENCY: what a capture must pay for Pro (default 4.99 USD). A value that
#   isn't a price refuses every payment rather than accepting any.
# - PAYPAL_API_BASE: https://api-m.sandbox.paypal.com for a sandbox test worker, never here (nothing
#   but PayPal's live and sandbox APIs is accepted). A sandbox copy needs its own kv_namespaces id:
#   sharing this one would let sandbox payments sign real licenses.
