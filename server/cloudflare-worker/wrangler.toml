name = "expressive-pro-activation"
main = "worker.js"
compatibility_date = "2024-09-01"

# Cloudflare KV namespace for storing activated device and transaction licenses
kv_namespaces = [
  { binding = "EXPRESSIVE_PRO_KV", id = "58380b9ca23940e4a3aa59c928b5eec1", preview_id = "EXPRESSIVE_PRO_LICENSES_PREVIEW_KV_ID" }
]

# Sensitive secrets (Set with `wrangler secret put <NAME>`):
# - PRO_PRIVATE_KEY_PEM: Master ECDSA P-256 private key. The worker holds the only copy: never
#   delete or replace it (`wrangler deploy` keeps it).
# - ADMIN_TOKEN: Long random token for POST /api/admin/issue (scripts/issue_pro_key.py)
# - PAYPAL_WEBHOOK_ID: ID of the webhook in the PayPal dashboard; webhooks are refused without it
# - PAYPAL_CLIENT_ID: PayPal REST API client ID (webhook checks and transaction lookups)
# - PAYPAL_CLIENT_SECRET: PayPal REST API client secret
