name: CI

on:
  push:
    branches:
      - '*-dev'
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
  workflow_call:

env:
  PUBLISH_NIGHTLY: true

jobs:
  build-debug-apk:
    strategy:
      matrix:
        build-variant: [ assembleLawnWithQuickstepNightlyRelease, assembleLawnWithQuickstepGithubDebug, assembleLawnWithQuickstepPlayDebug ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      - name: Write sign info
        if: github.repository_owner == 'LawnchairLauncher'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            umask 077
            : > keystore.properties
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" >> keystore.properties
            printf 'keyAlias=%s\n' "$KEY_ALIAS" >> keystore.properties
            printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> keystore.properties
            printf 'storeFile=%s/key.jks\n' "$GITHUB_WORKSPACE" >> keystore.properties
            printf '%s' "$KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
            chmod 600 keystore.properties "$GITHUB_WORKSPACE/key.jks"
          fi
      - name: Build APK
        env:
          BUILD_VARIANT: ${{ matrix.build-variant }}
        run: ./gradlew "$BUILD_VARIANT"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build-variant }}
          path: build/outputs/apk/**/*.apk
      - name: Clean up signing material
        if: always()
        run: |
          for secret_file in keystore.properties "$GITHUB_WORKSPACE/key.jks"; do
            if [ -f "$secret_file" ]; then
              shred -uz "$secret_file" 2>/dev/null || rm -f "$secret_file"
            fi
          done

  check-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck

  send-notifications:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'LawnchairLauncher'
    needs: build-debug-apk
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install gitpython requests
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: assembleLawnWith*
          merge-multiple: true
          path: artifacts/debug-apk
      - name: Send notifications
        run: python ci.py
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_CI_BOT_TOKEN }}
          TELEGRAM_CI_CHANNEL_ID: ${{ secrets.TELEGRAM_CI_CHANNEL_ID }}
          TELEGRAM_TEAM_GROUP_ID: ${{ secrets.NOTIFY_CHANNEL_ID }}
          ARTIFACT_DIRECTORY: artifacts/debug-apk
          GITHUB_REF: ${{ github.ref }}
          ACTION: internal_notifications

  crowdin-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'lawnchair-bot' && github.event.pull_request.title == 'New Crowdin translations by Github Action'
    needs: build-debug-apk
    steps:
      - env:
          GH_TOKEN: ${{ secrets.LAWNCHAIR_BOT_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "No issues found, auto-merging the Crowdin pull request."
          gh pr merge "$PR_URL" --auto --squash --delete-branch

  # Status check that is required in branch protection rules.
  final-status:
    needs:
      - build-debug-apk
      - check-style
    runs-on: ubuntu-slim
    if: always()
    outputs:
      publish_nightly: ${{ steps.publishing-status.outputs.publish_nightly }}
    steps:
      - name: Check
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs completed successfully."
      - id: publishing-status
        run: echo "publish_nightly=${{ env.PUBLISH_NIGHTLY }}" >> "$GITHUB_OUTPUT"

  nightly-release:
    runs-on: ubuntu-latest
    needs: final-status
    if: needs.final-status.outputs.publish_nightly == 'true' && github.repository_owner == 'LawnchairLauncher' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && endsWith(github.ref, '-dev')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: assembleLawnWithQuickstepNightlyRelease
      # Note the # and () symbols are not supported in GitHub Release filenames, even manually
      - name: Export APK_NAME for later use
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          short_sha="$(printf '%s' "$COMMIT_SHA" | cut -c1-7)"
          printf 'APK_NAME=Lawnchair.Debug.%s.Nightly-CI_%s-%s.apk\n' "$REF_NAME" "$RUN_NUMBER" "$short_sha" >> "$GITHUB_ENV"
      - name: Rename .apk file
        run: mv "./lawnWithQuickstepNightly/release/"*.apk "./$APK_NAME"
      - name: Delete release if exist then create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "nightly" && gh release delete "nightly" -y --cleanup-tag
          gh release create "nightly" "./$APK_NAME" -p -t "Lawnchair Nightly" --generate-notes
