name: Dependency Submission

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '50 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source and pinned SystemUI submodule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 37.1
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Generate and save dependency graph
        uses: gradle/actions/dependency-submission@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: false
          additional-arguments: '--no-daemon --no-scan --no-configuration-cache --max-workers=2'
          cache-disabled: true
          artifact-retention-days: 7

  submit:
    name: Submit main dependency graph
    needs: generate
    # PR builds only generate artifacts. The write-capable job never runs source code.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Submit the generated dependency graph
        uses: gradle/actions/dependency-submission@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          dependency-graph: download-and-submit
          dependency-graph-continue-on-failure: false
          cache-disabled: true
